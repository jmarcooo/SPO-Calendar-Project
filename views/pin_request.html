<div id="view-pin-request">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md dark:shadow-none shadow-slate-200/50 dark:shadow-slate-900/50 border border-slate-200 dark:border-slate-700" id="pin-request-tracking">
        <div class="px-4 py-5 sm:px-6 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h3 class="text-lg leading-6 font-bold text-gray-900 dark:text-white ">Pin Requests</h3>
                <p class="mt-1 max-w-2xl text-sm text-gray-500 dark:text-slate-400 ">Manage and track pin requests.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-3">
                <div class="flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-xl shadow-inner shadow-slate-200/50 dark:shadow-slate-900/50 border border-slate-200 dark:border-slate-700">
                    <button id="btn-pr-view-table" onclick="window.switchPRView('table')" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-white dark:bg-slate-800 text-primary-600 dark:text-primary-400 shadow-sm dark:shadow-none transition-all">Table List</button>
                    <button id="btn-pr-view-timeline" onclick="window.switchPRView('timeline')" class="px-4 py-1.5 text-sm font-medium rounded-lg text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:text-slate-300 transition-all">Weekly Slot Timeline</button>
                </div>
                <button onclick="window.openPinRequestModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-xl shadow-md dark:shadow-none shadow-slate-200/50 dark:shadow-slate-900/50 text-white bg-primary-600 hover:bg-primary-700 focus:outline-none transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i> Create Pin Request
                </button>
            </div>
        </div>

        <div id="pr-table-container">
        <div class="px-4 py-3 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400 dark:text-slate-500"></i>
                </div>
                <input type="text" id="pin-search-input" oninput="window.renderPinRequestsTable()" placeholder="Search by campaign, post ID, or owner..." class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 placeholder-gray-500 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            </div>
            <select id="pin-category-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Categories</option>
                <option value="PGC">PGC</option>
                <option value="UGC">UGC</option>
                <option value="Perya Host">Perya Host</option>
                <option value="Content Writer">Content Writer</option>
            </select>
            <select id="pin-status-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Pin Statuses</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Live">Live</option>
                <option value="Ended">Ended</option>
            </select>
            <button onclick="window.exportPinRequestsExcel()" class="block w-full sm:w-auto px-4 py-2 border border-gray-300 dark:border-slate-600 shadow-md dark:shadow-none shadow-slate-200/50 dark:shadow-slate-900/50 text-sm font-medium rounded-xl text-gray-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:bg-slate-900 dark:hover:bg-slate-700 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-emerald-600 dark:text-emerald-400 mr-2"></i>Export
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-slate-700">
                <thead class="bg-slate-50 dark:bg-slate-800">
                    <tr>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600 dark:bg-slate-700 transition-colors group" onclick="window.pinSortBy = 'campaignName'; window.pinSortDesc = !window.pinSortDesc; window.renderPinRequestsTable()">
                            Campaign/Game Name <i class="fa-solid fa-sort ml-1 text-gray-300"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Post Category
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider whitespace-nowrap">
                            Pin Start Time
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider whitespace-nowrap">
                            Pin End Time
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Priority
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Owner
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Request Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600 dark:bg-slate-700 transition-colors group" onclick="window.cyclePinSort()">
                            Pin Position <i class="fa-solid fa-sort text-gray-300 ml-1" id="pin-sort-icon"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Pin Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-right text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider w-24">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-slate-800 divide-y divide-gray-200 dark:divide-slate-700 text-sm" id="pin-requests-table-body">
                    <tr><td colspan="8" class="px-6 py-8 text-center text-gray-500 dark:text-slate-400 " id="pin-requests-empty-msg">No pin requests found.</td></tr>
                </tbody>
            </table>
        </div>
        </div>

        <div id="pr-timeline-container" class="hidden">
            <!-- Timeline Controls -->
            <div class="px-4 py-3 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                <div class="flex items-center space-x-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-slate-400 mb-1">Start Date</label>
                        <input type="date" id="pr-timeline-start-date" onchange="window.renderPRTimeline()" class="block w-40 border border-gray-300 dark:border-slate-600 rounded-lg shadow-sm dark:shadow-none py-1.5 px-3 sm:text-sm focus:ring-primary-500 focus:border-primary-500 bg-white dark:bg-slate-800">
                    </div>
                </div>
            </div>

            <!-- Timeline Grid -->
            <div class="relative w-full overflow-x-auto border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 z-0" id="pr-timeline-wrapper">
                <div class="min-w-[1200px] flex flex-col" id="pr-timeline-inner">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
    </div>
</div>
