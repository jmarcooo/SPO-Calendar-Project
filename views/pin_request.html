<div id="view-pin-request">
    <div class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-slate-200/60" id="pin-request-tracking">
        <div class="px-4 py-5 sm:px-6 border-b border-slate-200/60 flex flex-col sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h3 class="text-lg leading-6 font-bold text-gray-900">Pin Requests</h3>
                <p class="mt-1 max-w-2xl text-sm text-gray-500">Manage and track pin requests.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-3">
                <div class="flex items-center bg-slate-100 p-1 rounded-xl shadow-inner shadow-slate-200/50 border border-slate-200/60">
                    <button id="btn-pr-view-table" onclick="window.switchPRView('table')" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-white text-indigo-600 shadow-sm transition-all">Table List</button>
                    <button id="btn-pr-view-timeline" onclick="window.switchPRView('timeline')" class="px-4 py-1.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all">Weekly Slot Timeline</button>
                </div>
                <button onclick="window.openPinRequestModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-xl shadow-md shadow-slate-200/50 text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i> Create Pin Request
                </button>
            </div>
        </div>

        <div id="pr-table-container">
        <div class="px-4 py-3 bg-slate-50 border-b border-slate-200/60 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400"></i>
                </div>
                <input type="text" id="pin-search-input" oninput="window.renderPinRequestsTable()" placeholder="Search by campaign, post ID, or owner..." class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <select id="pin-category-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Categories</option>
                <option value="PGC">PGC</option>
                <option value="UGC">UGC</option>
                <option value="Perya Host">Perya Host</option>
                <option value="Content Writer">Content Writer</option>
            </select>
            <select id="pin-status-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Pin Statuses</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Live">Live</option>
                <option value="Ended">Ended</option>
            </select>
            <button onclick="window.exportPinRequestsExcel()" class="block w-full sm:w-auto px-4 py-2 border border-gray-300 shadow-md shadow-slate-200/50 text-sm font-medium rounded-xl text-gray-700 bg-white hover:bg-slate-50 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-emerald-600 mr-2"></i>Export
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Campaign/Game Name
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Post Category
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
                            Pin Start Time
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
                            Pin End Time
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Priority
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Owner
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group" onclick="window.cyclePinSort()">
                            Pin Position <i class="fa-solid fa-sort text-gray-300 ml-1" id="pin-sort-icon"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Pin Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200 text-sm" id="pin-requests-table-body">
                    <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500" id="pin-requests-empty-msg">No pin requests found.</td></tr>
                </tbody>
            </table>
        </div>
        </div>

        <div id="pr-timeline-container" class="hidden">
            <!-- Smart Availability Panel -->
            <div class="px-4 py-4 bg-slate-50 border-b border-slate-200/60">
                <h4 class="text-sm font-bold text-gray-800 mb-3"><i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mr-2"></i>Smart Slot Availability Assistant</h4>
                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4 items-end">
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Target Date</label>
                        <input type="date" id="pr-assist-date" class="block w-full border border-gray-300 rounded-lg shadow-sm py-1.5 px-3 sm:text-sm focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Start Time (UTC)</label>
                        <input type="time" id="pr-assist-time" class="block w-full border border-gray-300 rounded-lg shadow-sm py-1.5 px-3 sm:text-sm focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Duration</label>
                        <select id="pr-assist-duration" class="block w-full border border-gray-300 rounded-lg shadow-sm py-1.5 px-3 sm:text-sm focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                            <option value="24">1 Day</option>
                            <option value="48">2 Days</option>
                            <option value="72">3 Days</option>
                            <option value="96">4 Days</option>
                            <option value="120">5 Days</option>
                            <option value="144">6 Days</option>
                            <option value="168">7 Days</option>
                        </select>
                    </div>
                    <button onclick="window.checkPRSlotAvailability()" class="w-full sm:w-auto px-4 py-1.5 border border-indigo-200 text-indigo-700 bg-indigo-50 hover:bg-indigo-100 font-medium rounded-lg text-sm shadow-sm transition-colors">
                        <i class="fa-solid fa-search mr-1"></i> Scan Availability
                    </button>
                </div>
            </div>

            <!-- Timeline Grid -->
            <div class="relative w-full overflow-x-auto border-t border-slate-200/60 bg-white" id="pr-timeline-wrapper">
                <div class="min-w-[1200px] flex flex-col" id="pr-timeline-inner">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
    </div>
</div>
