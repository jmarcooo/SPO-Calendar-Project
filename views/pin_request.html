<div id="view-pin-request">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 overflow-hidden" id="pin-request-tracking">
        <div class="px-5 py-5 sm:px-6 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h3 class="text-xl leading-6 font-bold font-fun text-gingerbread-700 dark:text-amber-100 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-peppermint-500 text-base"></i>
                    <span>Pin Requests</span>
                </h3>
                <p class="mt-1 max-w-2xl text-xs sm:text-sm text-stone-500 dark:text-slate-400">Manage and track pin requests.</p>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-3 shrink-0">
                <div class="flex items-center bg-cream-100 dark:bg-slate-900 p-1 rounded-xl border border-cream-200 dark:border-slate-700">
                    <button id="btn-pr-view-table" onclick="window.switchPRView('table')" class="px-3.5 py-1.5 text-xs font-semibold font-fun rounded-lg bg-white dark:bg-slate-800 text-peppermint-600 dark:text-peppermint-300 shadow-xs transition-all">Table List</button>
                    <button id="btn-pr-view-timeline" onclick="window.switchPRView('timeline')" class="px-3.5 py-1.5 text-xs font-semibold font-fun rounded-lg text-stone-500 dark:text-slate-400 hover:text-gingerbread-700 dark:hover:text-white transition-all">Weekly Slot Timeline</button>
                </div>
                <button onclick="window.openPinRequestModal()" class="inline-flex items-center justify-center px-4 py-2 text-sm font-fun font-bold rounded-xl shadow-md shadow-peppermint-500/20 text-white bg-gradient-to-r from-peppermint-500 to-amber-500 hover:from-peppermint-600 hover:to-amber-600 focus:outline-none transition-all transform active:scale-95">
                    <i class="fa-solid fa-plus mr-2"></i> Create Pin Request
                </button>
            </div>
        </div>

        <div id="pr-table-container">
            <div class="px-5 py-3.5 bg-cream-100/70 dark:bg-slate-900/60 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1 max-w-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-stone-400 text-xs"></i>
                    </div>
                    <input type="text" id="pin-search-input" oninput="window.renderPinRequestsTable()" placeholder="Search by campaign, post ID, or owner..." class="block w-full pl-9 pr-3 py-2 border border-cream-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 text-stone-700 dark:text-white placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 sm:text-sm">
                </div>
                <select id="pin-category-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-44 pl-3 pr-8 py-2 text-sm text-stone-700 dark:text-slate-200 border border-cream-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 rounded-xl cursor-pointer font-medium">
                    <option value="All">All Categories</option>
                    <option value="PGC">PGC</option>
                    <option value="UGC">UGC</option>
                    <option value="Perya Host">Perya Host</option>
                    <option value="Content Writer">Content Writer</option>
                </select>
                <select id="pin-status-filter" onchange="window.renderPinRequestsTable()" class="block w-full sm:w-44 pl-3 pr-8 py-2 text-sm text-stone-700 dark:text-slate-200 border border-cream-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 rounded-xl cursor-pointer font-medium">
                    <option value="All">All Pin Statuses</option>
                    <option value="Upcoming">Upcoming</option>
                    <option value="Live">Live</option>
                    <option value="Ended">Ended</option>
                </select>
                <button onclick="window.exportPinRequestsExcel()" class="inline-flex items-center justify-center w-full sm:w-auto px-4 py-2 border border-cream-300 dark:border-slate-600 shadow-xs text-sm font-semibold rounded-xl text-gingerbread-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-cream-200/50 dark:hover:bg-slate-700 focus:outline-none transition-colors">
                    <i class="fa-solid fa-file-excel text-evergreen-600 mr-2"></i>Export
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-cream-200 dark:divide-slate-700">
                    <thead class="bg-cream-100/80 dark:bg-slate-900/70">
                        <tr>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group" onclick="window.pinSortBy = 'campaignName'; window.pinSortDesc = !window.pinSortDesc; window.renderPinRequestsTable()">
                                Campaign/Game Name <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                                Post Category
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider whitespace-nowrap">
                                Pin Start Time
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider whitespace-nowrap">
                                Pin End Time
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                                Priority
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                                Owner
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                                Request Status
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group" onclick="window.cyclePinSort()">
                                Pin Position <i class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1" id="pin-sort-icon"></i>
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                                Pin Status
                            </th>
                            <th scope="col" class="px-3 py-3 text-right text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider w-24">
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody class="bg-cream-50/40 dark:bg-slate-800 divide-y divide-cream-200/80 dark:divide-slate-700 text-sm" id="pin-requests-table-body">
                        <tr><td colspan="10" class="px-6 py-8 text-center text-stone-500 dark:text-slate-400" id="pin-requests-empty-msg">No pin requests found.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="pr-timeline-container" class="hidden">
            <!-- Timeline Controls -->
            <div class="px-5 py-3.5 bg-cream-100/70 dark:bg-slate-900/60 border-b border-cream-200 dark:border-slate-700">
                <div class="flex items-center space-x-4">
                    <div>
                        <label class="block text-xs font-semibold font-fun text-gingerbread-600 dark:text-slate-300 mb-1">Start Date</label>
                        <input type="date" id="pr-timeline-start-date" onchange="window.renderPRTimeline()" class="block w-44 border border-cream-300 dark:border-slate-600 rounded-xl shadow-xs py-1.5 px-3 sm:text-sm focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 bg-white dark:bg-slate-800 text-stone-700 dark:text-white">
                    </div>
                </div>
            </div>

            <!-- Timeline Grid -->
            <div class="relative w-full overflow-x-auto border-t border-cream-200 dark:border-slate-700 bg-cream-50 dark:bg-slate-800 z-0" id="pr-timeline-wrapper">
                <div class="min-w-[1200px] flex flex-col" id="pr-timeline-inner">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
    </div>
</div>
