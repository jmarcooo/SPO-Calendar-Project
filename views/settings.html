<div id="view-settings" class="space-y-6">
    <div class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-slate-200/60 p-6">
        <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Settings</h3>
        <p class="text-sm text-gray-500 mb-4">Customize your application experience.</p>

        <div class="space-y-4">
            <div>
                <label for="theme-selector" class="block text-sm font-medium text-gray-700 mb-2">Theme Color</label>
                <select id="theme-selector" onchange="window.changeTheme(this.value)" class="block w-full sm:w-64 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-xl">
                    <option value="indigo">Indigo (Default)</option>
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="red">Red</option>
                    <option value="purple">Purple</option>
                    <option value="orange">Orange</option>
                    <option value="pink">Pink</option>
                </select>
            </div>
        </div>
    </div>

    <div id="admin-settings-section" style="display: none;" class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-primary-200 p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-primary-500"></div>
        <h3 class="text-lg leading-6 font-bold text-primary-700 mb-4 flex items-center">
            <i class="fa-solid fa-lock-open mr-2"></i> Admin Settings
        </h3>
        <p class="text-sm text-gray-600 mb-6">Manage global configuration including Points of Contact (POC) for various modules. Max 3 POCs per module.</p>

        <div id="poc-settings-container" class="space-y-6">
            <!-- POC sections injected by JS -->
        </div>

        <div class="mt-6 flex justify-end">
            <button onclick="window.saveAdminPOCs()" class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-xl text-white bg-primary-600 hover:bg-primary-700 transition-colors">
                <i class="fa-solid fa-save mr-2"></i> Save POC Assignments
            </button>
        </div>
    </div>
</div>
