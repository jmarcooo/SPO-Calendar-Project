<div id="view-settings" class="space-y-6">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md shadow-slate-200/50 dark:shadow-none border border-slate-200/60 dark:border-slate-700 p-6">
        <h3 class="text-lg leading-6 font-bold text-gray-900 dark:text-white mb-4">Appearance</h3>

        <div class="mb-6 flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
            <div>
                <span class="block text-sm font-medium text-gray-900 dark:text-gray-200">Dark Mode</span>
                <span class="block text-sm text-gray-500 dark:text-gray-400">Toggle dark theme for the application.</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="settings-dark-mode" class="sr-only peer" onchange="window.toggleDarkModeSetting(this.checked)">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 dark:peer-focus:ring-primary-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary-600"></div>
            </label>
        </div>

        <div>
            <span class="block text-sm font-medium text-gray-900 dark:text-gray-200 mb-3">Theme Color</span>
            <div class="flex flex-wrap gap-3" id="settings-theme-colors">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <div id="admin-settings-section" style="display: none;" class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-primary-200 p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-primary-500"></div>
        <h3 class="text-lg leading-6 font-bold text-primary-700 mb-4 flex items-center">
            <i class="fa-solid fa-lock-open mr-2"></i> Admin Settings
        </h3>
        <p class="text-sm text-gray-600 mb-6">Manage global configuration including Points of Contact (POC) for various modules. Max 3 POCs per module.</p>

        <div id="poc-settings-container" class="space-y-6">
            <!-- POC sections injected by JS -->
        </div>

        <div class="mt-6 flex justify-end">
            <button onclick="window.saveAdminPOCs()" class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-xl text-white bg-primary-600 hover:bg-primary-700 transition-colors">
                <i class="fa-solid fa-save mr-2"></i> Save POC Assignments
            </button>
        </div>
    </div>
</div>
