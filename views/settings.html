<div id="view-settings" class="space-y-6">
    <div class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-slate-200/60 p-6">
        <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Settings</h3>
        <p class="text-sm text-gray-500">Settings configuration options will be available here.</p>
    </div>

    <div id="admin-settings-section" style="display: none;" class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-red-200 p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
        <h3 class="text-lg leading-6 font-bold text-red-700 mb-4 flex items-center">
            <i class="fa-solid fa-lock-open mr-2"></i> Admin Settings
        </h3>
        <p class="text-sm text-gray-600 mb-4">You have unlocked the admin-only configuration panel.</p>
        <div class="space-y-4">
            <div class="p-4 bg-red-50 border border-red-100 rounded-lg">
                <h4 class="text-sm font-semibold text-red-800 mb-2">Danger Zone</h4>
                <p class="text-xs text-red-600 mb-3">These actions can modify or permanently destroy global application data.</p>
                <button onclick="window.clearAllData ? window.clearAllData() : alert('Not implemented')" class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-xl text-white bg-red-600 hover:bg-red-700 transition-colors">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i> Purge Application Data
                </button>
            </div>
        </div>
    </div>
</div>
