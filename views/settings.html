<div id="view-settings" class="space-y-6">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 p-6">
        <h3 class="text-xl leading-6 font-bold font-fun text-gingerbread-700 dark:text-amber-100 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-palette text-peppermint-500 text-base"></i>
            <span>Appearance</span>
        </h3>

        <div class="mb-6 flex items-center justify-between border-b border-cream-200 dark:border-slate-700 pb-4">
            <div>
                <span class="block text-sm font-semibold text-stone-800 dark:text-slate-200">Dark Mode</span>
                <span class="block text-xs sm:text-sm text-stone-500 dark:text-slate-400">Toggle dark theme for the application.</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="settings-dark-mode" class="sr-only peer" onchange="window.toggleDarkModeSetting(this.checked)">
                <div class="w-11 h-6 bg-cream-300 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-peppermint-200 dark:peer-focus:ring-peppermint-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-cream-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-peppermint-500"></div>
            </label>
        </div>

        <div>
            <span class="block text-sm font-semibold text-stone-800 dark:text-slate-200 mb-3">Theme Color</span>
            <div class="flex flex-wrap gap-3" id="settings-theme-colors">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <div id="admin-settings-section" style="display: none;" class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-peppermint-200 dark:border-peppermint-800/60 p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-peppermint-500 to-amber-500"></div>
        <h3 class="text-lg leading-6 font-bold font-fun text-peppermint-700 dark:text-peppermint-300 mb-2 flex items-center">
            <i class="fa-solid fa-lock-open mr-2"></i> Admin Settings
        </h3>
        <p class="text-sm text-stone-600 dark:text-slate-400 mb-6">Manage global configuration including Points of Contact (POC) for various modules. Max 3 POCs per module.</p>

        <div id="poc-settings-container" class="space-y-4">
            <!-- POC sections injected by JS -->
        </div>

        <div class="mt-6 flex justify-end">
            <button onclick="window.saveAdminPOCs()" class="px-4 py-2 text-sm font-fun font-bold rounded-xl text-white bg-gradient-to-r from-peppermint-500 to-amber-500 hover:from-peppermint-600 hover:to-amber-600 shadow-md shadow-peppermint-500/20 transition-all transform active:scale-95">
                <i class="fa-solid fa-save mr-2"></i> Save POC Assignments
            </button>
        </div>
    </div>
</div>
