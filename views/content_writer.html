<div id="view-content-writer">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 overflow-hidden" id="cw-request-tracking">
        <div class="px-5 py-5 sm:px-6 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h3 class="text-xl leading-6 font-bold font-fun text-gingerbread-700 dark:text-amber-100 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-amber-600 text-base"></i>
                    <span>Copy Writer Requests</span>
                </h3>
                <p class="mt-1 max-w-2xl text-xs sm:text-sm text-stone-500 dark:text-slate-400">Manage and track content writer requests.</p>
            </div>
            <div class="flex space-x-3 shrink-0">
                <button onclick="window.openCWRequestModal()" class="inline-flex items-center justify-center px-4 py-2 text-sm font-fun font-bold rounded-xl shadow-md shadow-peppermint-500/20 text-white bg-gradient-to-r from-peppermint-500 to-amber-500 hover:from-peppermint-600 hover:to-amber-600 focus:outline-none transition-all transform active:scale-95">
                    <i class="fa-solid fa-plus mr-2"></i> Copy Writer Request
                </button>
            </div>
        </div>

        <div class="px-5 py-3.5 bg-cream-100/70 dark:bg-slate-900/60 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-stone-400 text-xs"></i>
                </div>
                <input type="text" id="cw-search-input" oninput="window.renderCWRequestsTable()" placeholder="Search by campaign or requestor..." class="block w-full pl-9 pr-3 py-2 border border-cream-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 text-stone-700 dark:text-white placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 sm:text-sm">
            </div>
            <button onclick="window.exportCWRequestsExcel()" class="inline-flex items-center justify-center w-full sm:w-auto px-4 py-2 border border-cream-300 dark:border-slate-600 shadow-xs text-sm font-semibold rounded-xl text-gingerbread-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-cream-200/50 dark:hover:bg-slate-700 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-evergreen-600 mr-2"></i>Export
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-cream-200 dark:divide-slate-700">
                <thead class="bg-cream-100/80 dark:bg-slate-900/70">
                    <tr>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group" onclick="window.cwSortBy = 'campaignName'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                            Campaign Name <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider whitespace-nowrap">
                            Created Date
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.cwSortBy = 'supportDate'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                            Support Date <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.cwSortBy = 'endDate'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                            Support End Date <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Campaign Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Priority Level
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Requested By
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Request Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-right text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider w-24">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-cream-50/40 dark:bg-slate-800 divide-y divide-cream-200/80 dark:divide-slate-700 text-sm" id="cw-requests-table-body">
                    <tr><td colspan="9" class="px-6 py-8 text-center text-stone-500 dark:text-slate-400" id="cw-requests-empty-msg">No CW requests found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
