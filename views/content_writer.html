<div id="view-content-writer">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md shadow-slate-200/50 border border-slate-200 dark:border-slate-700" id="cw-request-tracking">
        <div class="px-4 py-5 sm:px-6 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h3 class="text-lg leading-6 font-bold text-gray-900 dark:text-white">Copy Writer Requests</h3>
                <p class="mt-1 max-w-2xl text-sm text-gray-500 dark:text-slate-400">Manage and track content writer requests.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex space-x-3">
                <button onclick="window.openCWRequestModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-xl shadow-md shadow-slate-200/50 text-white bg-primary-600 hover:bg-primary-700 focus:outline-none transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i> Copy Writer Request
                </button>
            </div>
        </div>

        <div class="px-4 py-3 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400 dark:text-slate-500"></i>
                </div>
                <input type="text" id="cw-search-input" oninput="window.renderCWRequestsTable()" placeholder="Search by campaign or requestor..." class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 placeholder-gray-500 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            </div>
            <button onclick="window.exportCWRequestsExcel()" class="block w-full sm:w-auto px-4 py-2 border border-gray-300 dark:border-slate-600 shadow-md shadow-slate-200/50 text-sm font-medium rounded-xl text-gray-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:bg-slate-900 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-emerald-600 dark:text-emerald-400 mr-2"></i>Export
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-slate-700">
                <thead class="bg-slate-50 dark:bg-slate-900">
                    <tr>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group" onclick="window.cwSortBy = 'campaignName'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                                CAMPAIGN NAME <i class="fa-solid fa-sort ml-1"></i>
                            </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group whitespace-nowrap">
                            Created Date
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-600/50 dark:bg-slate-700" onclick="window.cwSortBy = 'supportDate'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                                SUPPORT DATE <i class="fa-solid fa-sort ml-1"></i>
                            </th>
                            <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-600/50 dark:bg-slate-700" onclick="window.cwSortBy = 'endDate'; window.cwSortDesc = !window.cwSortDesc; window.renderCWRequestsTable()">
                                SUPPORT END DATE <i class="fa-solid fa-sort ml-1"></i>
                            </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Campaign Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Priority Level
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Requested By
                        </th>
                        <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                            Request Status
                        </th>
                        <th scope="col" class="px-3 py-3 text-right text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider w-24">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-slate-800 divide-y divide-gray-200 dark:divide-slate-700 text-sm" id="cw-requests-table-body">
                    <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500 dark:text-slate-400" id="cw-requests-empty-msg">No CW requests found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
