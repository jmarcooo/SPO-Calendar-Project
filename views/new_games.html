<div id="view-game" class="space-y-6">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 p-5 flex flex-wrap justify-between items-center gap-4">
        <div>
            <h3 class="text-xl font-bold font-fun text-gingerbread-700 dark:text-amber-100 flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-peppermint-500 text-base"></i>
                <span>New Games</span>
            </h3>
            <p class="text-xs sm:text-sm text-stone-500 dark:text-slate-400 mt-0.5" id="new-games-month-label">Showing games for the current month.</p>
        </div>
        <div class="inline-flex items-center rounded-xl bg-cream-100 dark:bg-slate-900 border border-cream-200 dark:border-slate-700 p-0.5">
            <button type="button" onclick="window.changeGameMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg text-stone-500 dark:text-slate-400 hover:bg-cream-50 dark:hover:bg-slate-800 hover:text-gingerbread-700 dark:hover:text-white transition-colors" title="Previous Month"><i class="fa-solid fa-chevron-left text-xs"></i></button>
            <button type="button" onclick="window.resetGameMonth()" class="px-3 h-8 flex items-center justify-center rounded-lg text-xs font-semibold text-stone-700 dark:text-slate-200 hover:bg-cream-50 dark:hover:bg-slate-800 transition-colors">Today</button>
            <button type="button" onclick="window.changeGameMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-lg text-stone-500 dark:text-slate-400 hover:bg-cream-50 dark:hover:bg-slate-800 hover:text-gingerbread-700 dark:hover:text-white transition-colors" title="Next Month"><i class="fa-solid fa-chevron-right text-xs"></i></button>
        </div>
    </div>
    <!-- Cards Container -->
    <div id="game-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <!-- Cards injected here -->
    </div>
</div>
