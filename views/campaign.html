<div id="view-campaign" class="space-y-6">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h3 class="text-xl font-bold font-fun text-gingerbread-700 dark:text-amber-100 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-peppermint-500 text-base"></i>
                <span>SPO Team Posts</span>
            </h3>
            <p class="text-xs sm:text-sm text-stone-500 dark:text-slate-400 mt-0.5">Record and manage SPO team posts.</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
                <label for="spo-team-posts-month-filter" class="text-xs font-semibold text-stone-500 dark:text-slate-300">Filter:</label>
                <input type="month" id="spo-team-posts-month-filter" onchange="window.filterSPOTeamPostsByMonth(this.value)" class="block border border-cream-300 dark:border-slate-600 rounded-xl shadow-xs py-1.5 px-3 focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 sm:text-sm bg-white dark:bg-slate-800 text-stone-700 dark:text-white">
            </div>
            <button onclick="window.extractSPOTeamPosts()" class="inline-flex items-center justify-center px-4 py-2 border border-cream-300 dark:border-slate-600 shadow-xs text-sm font-semibold rounded-xl text-gingerbread-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-cream-200/50 dark:hover:bg-slate-700 transition-colors">
                <i class="fa-solid fa-download mr-2 text-evergreen-600"></i> Extract
            </button>
            <button onclick="window.openSPOTeamPostModal()" class="inline-flex items-center justify-center px-4 py-2 text-sm font-fun font-bold rounded-xl shadow-md shadow-peppermint-500/20 text-white bg-gradient-to-r from-peppermint-500 to-amber-500 hover:from-peppermint-600 hover:to-amber-600 transition-all transform active:scale-95">
                <i class="fa-solid fa-plus mr-2"></i> Add Post
            </button>
        </div>
    </div>

    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-cream-200 dark:divide-slate-700">
                <thead class="bg-cream-100/80 dark:bg-slate-900/70">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.sortSPOTeamPosts('title')">
                            Title <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.sortSPOTeamPosts('datePosted')">
                            Date Posted <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.sortSPOTeamPosts('createdBy')">
                            Created By <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors" onclick="window.sortSPOTeamPosts('accountUsed')">
                            Account Used <i class="fa-solid fa-sort ml-1 text-gingerbread-200 dark:text-slate-600"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Post URL
                        </th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody id="spo-team-posts-tbody" class="bg-cream-50/40 dark:bg-slate-800 divide-y divide-cream-200/80 dark:divide-slate-700">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
        <div id="spo-team-posts-empty" class="p-8 text-center text-stone-500 dark:text-slate-400 hidden">
            <p class="font-fun text-sm">No posts recorded yet.</p>
        </div>
    </div>
</div>
