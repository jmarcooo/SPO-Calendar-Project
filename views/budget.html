            <div id="view-budget" >

                        </div>
                        <div>
                            <label for="setting-budget-month" class="block text-xs font-medium text-gray-700 mb-1">Active Month</label>
                            <input type="month" id="setting-budget-month" onchange="syncBudgetMonth(this.value)" class="block w-full sm:w-40 border border-gray-300 rounded-xl shadow-md shadow-slate-200/50 py-1.5 px-3 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="setting-budget-limit" class="block text-xs font-medium text-gray-700 mb-1">Limit (Selected Month)</label>
                            <input type="number" step="0.01" min="0" id="setting-budget-limit" class="block w-full sm:w-36 border border-gray-300 rounded-xl shadow-md shadow-slate-200/50 py-1.5 px-3 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="setting-budget-currency" class="block text-xs font-medium text-gray-700 mb-1">Currency</label>

                                <option value="PHP">PHP</option>
                                <option value="USD">USD</option>
                            </select>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="saveBudgetSettings()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 py-1.5 px-3 rounded-xl shadow-md shadow-slate-200/50 text-sm font-medium">Save Limit</button>

                                <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Migrate
                            </button>
                            <button onclick="clearAllBudgets()" class="bg-red-50 text-red-700 hover:bg-red-100 border border-red-200 py-1.5 px-3 rounded-xl shadow-md shadow-slate-200/50 text-sm font-medium transition-colors">
                                <i class="fa-solid fa-trash-can mr-1"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md shadow-slate-200/50 border border-slate-200/60">

                        <div class="mt-4 sm:mt-0 flex space-x-3">
                            <button onclick="openBudgetDrawer()" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-xl shadow-md shadow-slate-200/50 text-gray-700 bg-white hover:bg-slate-50">
                                <i class="fa-solid fa-list-ul mr-2"></i> View All Months
                            </button>
                            <button onclick="openBudgetModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-xl shadow-md shadow-slate-200/50 text-white bg-indigo-600 hover:bg-indigo-700">
                                <i class="fa-solid fa-plus mr-2"></i> Add Budget Entry
                            </button>
                        </div>
                    </div>

                        </div>
                        <select id="budget-filter-owner" onchange="setBudgetOwnerFilter(this.value)" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 bg-white focus:ring-indigo-500 sm:text-sm rounded-xl cursor-pointer">

                        </select>
                        <input type="month" id="budget-filter-month" onchange="setBudgetMonthFilter(this.value)" class="block w-full sm:w-40 pl-3 pr-3 py-2 text-base border border-gray-300 bg-white focus:ring-indigo-500 sm:text-sm rounded-xl cursor-pointer">

                                        Month <i id="budget-sort-icon-month" class="fa-solid fa-sort text-gray-300 ml-1"></i>
                                    </th>
                                    <th scope="col" onclick="handleBudgetSort('name')" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-slate-100 group">

                                    </th>
                                    <th scope="col" onclick="handleBudgetSort('type')" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-slate-100 group">

                                    </th>
                                    <th scope="col" onclick="handleBudgetSort('owner')" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-slate-100 group">
                                        Owner <i id="budget-sort-icon-owner" class="fa-solid fa-sort text-gray-300 ml-1"></i>
                                    </th>
                                    <th scope="col" onclick="handleBudgetSort('allocated')" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-slate-100 group">
                                        Allocated Budget <i id="budget-sort-icon-allocated" class="fa-solid fa-sort text-gray-300 ml-1"></i>
                                    </th>
                                    <th scope="col" onclick="handleBudgetSort('spent')" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-slate-100 group">

                                    </th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Remaining Balance</th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="budget-table-body">

                            <tfoot class="bg-slate-50 font-medium">
                                <tr>
                                    <td colspan="4" class="px-6 py-4 text-left text-sm text-gray-900 uppercase">Total</td>
                                    <td class="px-6 py-4 text-right text-sm text-gray-900" id="budget-total-allocated">₱0.00</td>
                                    <td class="px-6 py-4 text-right text-sm text-gray-900" id="budget-total-spent">₱0.00</td>
                                    <td class="px-6 py-4 text-right text-sm text-blue-600 font-bold" id="budget-total-remaining">₱0.00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
