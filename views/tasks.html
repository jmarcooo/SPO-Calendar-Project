<div id="view-tasks">
    <div class="bg-cream-50 dark:bg-slate-800 rounded-2xl shadow-festive border border-cream-200 dark:border-slate-700 overflow-hidden" id="progress-tracking">
        <div class="px-5 py-5 sm:px-6 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h3 class="text-xl leading-6 font-bold font-fun text-gingerbread-700 dark:text-amber-100 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-peppermint-500 text-base"></i>
                    <span>Detailed Progress Tracking</span>
                </h3>
                <p class="mt-1 max-w-2xl text-xs sm:text-sm text-stone-500 dark:text-slate-400">Manage task statuses, update progress, and send reminders. (Offline events &amp; game launches are excluded)</p>
            </div>
            <div class="flex space-x-3 shrink-0">
                <button onclick="openTypeModal()" class="inline-flex items-center justify-center px-4 py-2 text-sm font-fun font-bold rounded-xl shadow-md shadow-peppermint-500/20 text-white bg-gradient-to-r from-peppermint-500 to-amber-500 hover:from-peppermint-600 hover:to-amber-600 focus:outline-none transition-all transform active:scale-95">
                    <i class="fa-solid fa-plus mr-2"></i> New Task
                </button>
            </div>
        </div>

        <div class="px-5 py-3.5 bg-cream-100/70 dark:bg-slate-900/60 border-b border-cream-200 dark:border-slate-700 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-stone-400 text-xs"></i>
                </div>
                <input type="text" id="search-input" oninput="setSearch(this.value)" placeholder="Search by title or assignee..." class="block w-full pl-9 pr-3 py-2 border border-cream-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 text-stone-700 dark:text-white placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 sm:text-sm transition-all">
            </div>
            <select id="assignee-filter-select" onchange="setAssigneeFilter(this.value)" class="block w-full sm:w-44 pl-3 pr-8 py-2 text-sm border border-cream-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-stone-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 rounded-xl cursor-pointer font-medium">
                <option value="All">All Assignees</option>
            </select>
            <select id="filter-select" onchange="setFilter(this.value)" class="block w-full sm:w-44 pl-3 pr-8 py-2 text-sm border border-cream-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-stone-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-peppermint-400 focus:border-peppermint-400 rounded-xl cursor-pointer font-medium">
                <option value="All">All Statuses</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Done">Done</option>
            </select>
            <button onclick="exportTasksExcel()" class="inline-flex items-center justify-center w-full sm:w-auto px-4 py-2 border border-cream-300 dark:border-slate-600 shadow-xs text-sm font-semibold rounded-xl text-gingerbread-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-cream-200/50 dark:hover:bg-slate-700 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-evergreen-600 mr-2"></i>Export to Excel
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-cream-200 dark:divide-slate-700">
                <thead class="bg-cream-100/80 dark:bg-slate-900/70">
                    <tr>
                        <th scope="col" onclick="handleSort('title')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            Content Task <i id="sort-icon-title" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" onclick="handleSort('startDate')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            Start Date <i id="sort-icon-startDate" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" onclick="handleSort('endDate')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            End Date <i id="sort-icon-endDate" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" onclick="handleSort('assignees')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            Assignees <i id="sort-icon-assignees" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" onclick="handleSort('status')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            Status <i id="sort-icon-status" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" onclick="handleSort('progress')" class="px-6 py-3 text-left text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider cursor-pointer hover:bg-cream-200/60 dark:hover:bg-slate-800 transition-colors group">
                            Progress <i id="sort-icon-progress" class="fa-solid fa-sort text-gingerbread-200 dark:text-slate-600 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-semibold font-fun text-gingerbread-600 dark:text-amber-200/80 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-cream-50/40 dark:bg-slate-800 divide-y divide-cream-200/80 dark:divide-slate-700" id="tasks-table-body">
                    <tr><td colspan="7" class="px-6 py-6 text-center text-sm text-stone-500 dark:text-slate-400">Loading tasks...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
