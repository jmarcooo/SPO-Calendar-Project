<div id="view-daily-task">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md shadow-slate-200/50 border border-slate-200/60" id="daily-task-tracking">
        <div class="px-4 py-5 sm:px-6 border-b border-slate-200/60 flex flex-col sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h3 class="text-lg leading-6 font-bold text-gray-900 dark:text-white">Daily Tasks</h3>
                <p class="mt-1 max-w-2xl text-sm text-gray-500 dark:text-slate-400">Manage and track daily task requests.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex space-x-3">
                <button onclick="window.openDailyTaskModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-xl shadow-md shadow-slate-200/50 text-white bg-primary-600 hover:bg-primary-700 focus:outline-none transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i> Create Daily Task Request
                </button>
            </div>
        </div>

        <div class="px-4 py-3 bg-slate-50 dark:bg-slate-900 border-b border-slate-200/60 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
            <div class="relative flex-1 max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400 dark:text-slate-500"></i>
                </div>
                <input type="text" id="daily-search-input" oninput="window.renderDailyTasksTable()" placeholder="Search by title or requestor..." class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-slate-600 rounded-xl leading-5 bg-white dark:bg-slate-800 placeholder-gray-500 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            </div>
            <select id="daily-requestor-filter" onchange="window.renderDailyTasksTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Requestors</option>
            </select>
            <select id="daily-status-filter" onchange="window.renderDailyTasksTable()" class="block w-full sm:w-40 pl-3 pr-8 py-2 text-base border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-xl cursor-pointer">
                <option value="All">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Under Review">Under Review</option>
                <option value="Completed">Completed</option>
            </select>
            <button onclick="window.exportDailyTasksExcel()" class="block w-full sm:w-auto px-4 py-2 border border-gray-300 dark:border-slate-600 shadow-md shadow-slate-200/50 text-sm font-medium rounded-xl text-gray-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:bg-slate-900 focus:outline-none transition-colors">
                <i class="fa-solid fa-file-excel text-emerald-600 mr-2"></i>Export
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-slate-50 dark:bg-slate-900">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group" onclick="window.dtSortBy = 'taskTitle'; window.dtSortDesc = !window.dtSortDesc; window.renderDailyTasksTable()">
                            Title <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Created Time <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Start Date <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            End Date <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Requested By <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Request Status <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:bg-slate-100 transition-colors group">
                            Campaign Status <i class="fa-solid fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-slate-400 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-slate-800 divide-y divide-gray-200" id="daily-tasks-table-body">
                    <tr><td colspan="9" class="px-6 py-8 text-center text-sm text-gray-500 dark:text-slate-400" id="daily-tasks-empty-msg">No daily tasks found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
